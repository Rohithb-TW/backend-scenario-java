name: "M03 — CI/CD Pipeline (<=5 min to prod)"

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
#   push to main/master  →  full pipeline: build → security gates → deploy
#   pull_request         →  handled exclusively by pr.yml
#
# Pipeline graph:
#   build-test ──┬──► snyk-gate   ─┐
#                └──► sonarqube   ─┴──► trivy-gate ──► deploy ──► pipeline-summary
#
# Caching strategy:
#   Maven deps  — keyed on pom.xml hash, restored in every job (~30s saved/job)
#   Snyk CLI    — npm cache + binary (~15s saved)
#   Trivy DB    — vulnerability DB cached between runs (~40s saved)
#   Docker      — buildx layer cache via GHA cache backend (~30s saved)
#   kind binary — cached so no re-download (~5s saved)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write  # required for SARIF upload to GitHub Security tab

# Cancel any in-progress run for the same branch to avoid queued races.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: petclinic
  IMAGE_TAG: ${{ github.sha }}
  MAVEN_OPTS: "-Xmx2g -Dartifact.threads=8"

# ═════════════════════════════════════════════════════════════════════════════
# PHASE 1 — Build, test, and package  (~60-90s with warm Maven cache)
# ═════════════════════════════════════════════════════════════════════════════
jobs:

  build-test:
    name: "Build & Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Shared Maven cache — keyed on pom.xml so it invalidates on dependency changes
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build and verify
        run: |
          chmod +x mvnw
          ./mvnw clean verify -q

      - name: Publish test summary
        if: always()
        run: python3 .github/scripts/test_summary.py

      - name: Publish cache summary
        if: always()
        run: python3 .github/scripts/cache_summary.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ github.sha }}
          path: target/spring-petclinic-rest-*.jar
          retention-days: 1

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ github.sha }}
          path: target/site/jacoco/
          retention-days: 1

# ═════════════════════════════════════════════════════════════════════════════
# PHASE 2a — Snyk SCA gate  (~30s with warm cache)
# ═════════════════════════════════════════════════════════════════════════════
  snyk-gate:
    name: "Snyk SCA Gate"
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      # Maven cache — needed for Snyk to resolve the dependency graph
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # Cache Snyk CLI installation
      - name: Cache Snyk CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: snyk-cli-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: snyk-cli-${{ runner.os }}-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: app-jar-${{ github.sha }}
          path: target/

      - name: Install Snyk CLI
        run: npm install -g snyk --silent

      - name: Snyk test — fail on Critical/High
        env:
          SNYK_TOKEN: ${{ secrets.TWSSnykPAT }}
        run: |
          snyk auth "$SNYK_TOKEN"
          set +e
          snyk test --all-projects --severity-threshold=high --json-file-output=snyk-report.json
          SNYK_RC=$?
          set -e
          python3 .github/scripts/snyk_summary.py snyk-report.json "${{ github.sha }}" "$SNYK_RC"
          exit $SNYK_RC

      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report-${{ github.sha }}
          path: snyk-report.json

      - name: Snyk monitor (upload snapshot to dashboard)
        if: success()
        env:
          SNYK_TOKEN: ${{ secrets.TWSSnykPAT }}
        run: snyk monitor --all-projects

# ═════════════════════════════════════════════════════════════════════════════
# PHASE 2b — SonarQube SAST  (~40s with warm cache, no test re-run)
# ═════════════════════════════════════════════════════════════════════════════
  sonarqube:
    name: "SonarQube SAST"
    runs-on: ubuntu-latest
    needs: build-test
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Maven cache — shared key with build-test for instant restore
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # SonarCloud analysis cache — dramatically speeds up repeated scans
      - name: Cache SonarCloud scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: sonar-${{ runner.os }}-

      - name: Download JAR (reuse build-test output)
        uses: actions/download-artifact@v4
        with:
          name: app-jar-${{ github.sha }}
          path: target/

      - name: Download JaCoCo report (reuse build-test coverage)
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-${{ github.sha }}
          path: target/site/jacoco/

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.TWSQPAT }}
        run: |
          chmod +x mvnw
          ./mvnw package org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar -DskipTests -Dsonar.projectKey=rohithb-tw_backend-scenario-java -Dsonar.projectName=backend-scenario-java -Dsonar.organization=rohithb-tw -Dsonar.host.url=https://sonarcloud.io -Dsonar.token="${SONAR_TOKEN}" -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml -Dsonar.java.source=21 -q

      - name: SonarQube summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          {
            echo "## SonarQube SAST (advisory)"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Result | ${STATUS} |"
            echo "| Dashboard | [SonarCloud](https://sonarcloud.io/project/overview?id=rohithb-tw_backend-scenario-java) |"
          } >> "$GITHUB_STEP_SUMMARY"

# ═════════════════════════════════════════════════════════════════════════════
# PHASE 3 — Docker build + Trivy scan  (~45s with layer + DB cache)
# ═════════════════════════════════════════════════════════════════════════════
  trivy-gate:
    name: "Docker Build + Trivy Image Gate"
    runs-on: ubuntu-latest
    needs: [build-test, snyk-gate]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-jar-${{ github.sha }}
          path: target/

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Docker layer cache — reuses unchanged layers across runs
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Dockerfile') }}-${{ github.sha }}
          restore-keys: docker-${{ runner.os }}-${{ hashFiles('Dockerfile') }}-

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          labels: |
            git.sha=${{ github.sha }}
            git.ref=${{ github.ref_name }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          load: true

      # Rotate cache to prevent unbounded growth
      - name: Rotate Docker layer cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # Cache Trivy vulnerability DB — saves ~40s on repeated scans
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Trivy — fail on Critical/High (hard gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Trivy — SARIF upload (GitHub Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

      - name: Trivy — JSON for summary
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH

      - name: Publish Trivy summary
        if: always()
        run: python3 .github/scripts/trivy_summary.py trivy.json "${{ github.sha }}"

      - name: Export image tar
        if: success()
        run: docker save "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" | gzip > image.tar.gz

      - name: Upload image tar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: image.tar.gz
          retention-days: 1

# ═════════════════════════════════════════════════════════════════════════════
# PHASE 4 — Deploy to kind cluster  (~75s with cached kind binary)
# ═════════════════════════════════════════════════════════════════════════════
  deploy:
    name: "Deploy to kind (production)"
    runs-on: ubuntu-latest
    needs: [snyk-gate, trivy-gate]
    environment:
      name: production
      url: http://localhost:30080/petclinic/actuator/health

    steps:
      - uses: actions/checkout@v4

      - name: Download pre-scanned Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.sha }}

      # Cache kind binary — avoid re-downloading on every run
      - name: Cache kind binary
        id: cache-kind
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/kind
          key: kind-v0.23.0-${{ runner.os }}

      - name: Install kind
        if: steps.cache-kind.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sLo "$HOME/.local/bin/kind" "https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64"
          chmod +x "$HOME/.local/bin/kind"

      - name: Add kind to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create kind cluster
        run: |
          kind create cluster --config k8s/kind-cluster.yml --wait 60s
          kubectl cluster-info --context kind-petclinic-prod

      - name: Load image into kind nodes
        run: |
          docker load < image.tar.gz
          kind load docker-image "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" --name petclinic-prod

      - name: Patch image tag in deployment manifest
        run: sed -i "s|image: petclinic:.*|image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g" k8s/deployment.yml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/service-nodeport.yml

      - name: Wait for rollout
        run: kubectl rollout status deployment/petclinic --namespace petclinic --timeout=120s

      - name: Smoke test — health endpoint
        id: smoke
        run: |
          echo "Waiting for app to become ready..."
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:30080/petclinic/actuator/health 2>/dev/null || echo "000")
            echo "  attempt $i — HTTP ${CODE}"
            if [ "${CODE}" = "200" ]; then
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              echo "App is healthy (HTTP 200)"
              exit 0
            fi
            sleep 10
          done
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          echo "App did not become healthy within 180 s"
          exit 1

      - name: Collect kubectl evidence
        if: always()
        run: |
          NS=petclinic
          mkdir -p /tmp/evidence
          kubectl get pods -n ${NS} -o wide > /tmp/evidence/pods.txt 2>&1
          kubectl get deployments -n ${NS} -o wide > /tmp/evidence/deployments.txt 2>&1
          kubectl get svc -n ${NS} > /tmp/evidence/services.txt 2>&1
          kubectl describe deployment/petclinic -n ${NS} > /tmp/evidence/describe.txt 2>&1
          kubectl get events -n ${NS} --sort-by='.lastTimestamp' > /tmp/evidence/events.txt 2>&1
          kubectl top pods -n ${NS} > /tmp/evidence/top.txt 2>/dev/null || echo "(metrics-server not installed)" >> /tmp/evidence/top.txt
          for POD in $(kubectl get pods -n ${NS} -o name 2>/dev/null); do
            echo "=== ${POD} ===" >> /tmp/evidence/pod-logs.txt
            kubectl logs "${POD}" -n ${NS} --tail=50 >> /tmp/evidence/pod-logs.txt 2>&1
          done
          curl -s http://localhost:30080/petclinic/actuator/health > /tmp/evidence/health.json 2>/dev/null || echo '{"status":"unreachable"}' > /tmp/evidence/health.json

      - name: Upload kubectl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubectl-evidence-${{ github.sha }}
          path: /tmp/evidence/
          retention-days: 7

      - name: Write deployment summary
        if: always()
        run: |
          DEPLOY_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          HEALTHY="${{ steps.smoke.outputs.healthy }}"
          HEALTH_STATUS="$([ "$HEALTHY" = "true" ] && echo "PASSING" || echo "FAILING")"
          {
            echo ""
            echo "---"
            echo ""
            echo "# Production Deployment — kind Cluster"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Deploy time  | `${DEPLOY_TIME}` |"
            echo "| Image        | `${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}` |"
            echo "| Git SHA      | `${{ github.sha }}` |"
            echo "| Branch       | `${{ github.ref_name }}` |"
            echo "| Triggered by | @${{ github.actor }} |"
            echo "| Health check | ${HEALTH_STATUS} |"
            echo ""
            echo "## Pod Status"
            echo '```'
            cat /tmp/evidence/pods.txt 2>/dev/null || echo "unavailable"
            echo '```'
            echo ""
            echo "## Health Endpoint Response"
            echo '```json'
            cat /tmp/evidence/health.json 2>/dev/null || echo "unreachable"
            echo '```'
            echo ""
            echo "## Recent Events"
            echo '```'
            tail -20 /tmp/evidence/events.txt 2>/dev/null || echo "unavailable"
            echo '```'
            echo ""
            echo "> Security promise kept: Snyk SCA and Trivy image gates passed."
            echo "> No Critical or High CVE was permitted through to production."
          } >> "$GITHUB_STEP_SUMMARY"

# ═════════════════════════════════════════════════════════════════════════════
# PHASE 5 — Aggregate pipeline summary (always runs)
# ═════════════════════════════════════════════════════════════════════════════
  pipeline-summary:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [build-test, snyk-gate, trivy-gate, sonarqube, deploy]
    if: always()

    steps:
      - name: Write pipeline summary
        run: |
          BUILD="${{ needs.build-test.result }}"
          SNYK="${{ needs.snyk-gate.result }}"
          TRIVY="${{ needs.trivy-gate.result }}"
          SONAR="${{ needs.sonarqube.result }}"
          DEPLOY="${{ needs.deploy.result }}"

          result() { [ "$1" = "success" ] && echo "✅ PASSED" || ([ "$1" = "skipped" ] && echo "⏭️ SKIPPED" || echo "❌ FAILED"); }

          OVERALL="✅ ALL STAGES PASSED"
          for r in "$BUILD" "$SNYK" "$TRIVY" "$DEPLOY"; do
            if [ "$r" != "success" ]; then
              OVERALL="❌ PIPELINE FAILED"
              break
            fi
          done

          {
            echo ""
            echo "---"
            echo ""
            echo "# M03 Pipeline — Full Run Summary"
            echo ""
            echo "| Stage | Job | Result |"
            echo "|---|---|---|"
            echo "| Phase 1 | Build and Test   | $(result $BUILD) |"
            echo "| Phase 1 | Caching          | ✅ Caffeine — petTypes, vets, specialties, owners, pets, visits (10 min TTL, max 500 entries) |"
            echo "| Phase 2 | Snyk SCA Gate    | $(result $SNYK) |"
            echo "| Phase 2 | SonarQube SAST   | $(result $SONAR) (advisory) |"
            echo "| Phase 3 | Trivy Image Gate | $(result $TRIVY) |"
            echo "| Phase 4 | Deploy to kind   | $(result $DEPLOY) |"
            echo ""
            echo "## ${OVERALL}"
            echo ""
            echo "| Field  | Value |"
            echo "|---|---|"
            echo "| Commit | `${{ github.sha }}` |"
            echo "| Branch | `${{ github.ref_name }}` |"
            echo "| Actor  | @${{ github.actor }} |"
            echo "| Run    | ${{ github.run_number }} |"
            echo ""
            echo "> Security promise: No Critical or High CVE may reach production."
            echo "> Both Snyk and Trivy gates are hard blockers."
          } >> "$GITHUB_STEP_SUMMARY"
