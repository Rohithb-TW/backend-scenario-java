name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Compile, test, and verify the project
  # ──────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and verify with Maven
        run: ./mvnw clean verify

      # Cache the local Maven repository so parallel jobs can reuse it
      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

  # ──────────────────────────────────────────────
  # Job 2: SonarQube static analysis (SAST + quality gates)
  # Runs in parallel with Snyk after build succeeds
  # Requires: SONAR_TOKEN secret in GitHub repository settings
  # ──────────────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          # Fetch full history for accurate blame/coverage data
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Restore Maven local repository cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.TWSQPAT }}
        run: |
          ./mvnw clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=rohithb-tw_Rohithb-TW \
            -Dsonar.projectName="Rohithb-TW" \
            -Dsonar.organization=rohithb-tw \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.source=21

  # ──────────────────────────────────────────────
  # Job 3: Snyk security scan (SCA + dependency vulnerabilities)
  # Runs in parallel with SonarQube after build succeeds
  # Requires: SNYK_TOKEN secret in GitHub repository settings
  # ──────────────────────────────────────────────
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Restore Maven local repository cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build project (needed for Snyk dependency resolution)
        run: ./mvnw clean package -DskipTests

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.TWSSnykPAT }}
        run: snyk auth $SNYK_TOKEN

      - name: Run Snyk dependency vulnerability test
        env:
          SNYK_TOKEN: ${{ secrets.TWSSnykPAT }}
        # --all-projects scans all Maven modules
        # --severity-threshold=high  → fail only on high/critical vulns
        # || true                    → don't fail the pipeline on found vulns (optional: remove to enforce)
        run: snyk test --all-projects --severity-threshold=high || true

      - name: Monitor project with Snyk (uploads snapshot to Snyk dashboard)
        env:
          SNYK_TOKEN: ${{ secrets.TWSSnykPAT }}
        # Only monitor on pushes to main/master (not on PRs) to avoid duplicate snapshots
        # Note: --project-name is incompatible with --all-projects; Snyk auto-names from manifest
        if: github.event_name == 'push'
        run: snyk monitor --all-projects