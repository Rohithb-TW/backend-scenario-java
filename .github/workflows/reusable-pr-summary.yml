name: Reusable PR Summary

on:
  workflow_call:

jobs:
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest

    steps:
      - name: Build PR summary
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('pull_request payload is required');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const changedFiles = files.slice(0, 20).map(file => `- ${file.filename} (${file.status})`).join('\n');
            const commitLines = commits.slice(0, 10).map(commit => `- ${commit.commit.message.split('\n')[0]}`).join('\n');
            const body = [
              `PR #${pr.number}: ${pr.title}`,
              '',
              `Repository: ${context.repo.owner}/${context.repo.repo}`,
              `Author: ${pr.user.login}`,
              `Source: ${pr.head.ref}`,
              `Target: ${pr.base.ref}`,
              `URL: ${pr.html_url}`,
              '',
              'Description:',
              pr.body || 'No PR description provided.',
              '',
              `Changed files (${files.length}):`,
              changedFiles || 'No files reported.',
              '',
              `Commits (${commits.length}):`,
              commitLines || 'No commits reported.'
            ].join('\n');

            core.summary
              .addHeading(`PR Summary #${pr.number}`)
              .addCodeBlock(body)
              .write();