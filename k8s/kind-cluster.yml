# ─────────────────────────────────────────────────────────────────────────────
# kind cluster configuration for the petclinic CI/CD pipeline
# Used by the GitHub Actions deploy job on every push to main/master
# ─────────────────────────────────────────────────────────────────────────────
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: petclinic-prod

nodes:
  - role: control-plane
    # Enable port mapping so the smoke-test job can curl the app
    extraPortMappings:
      - containerPort: 30080   # NodePort target in service-nodeport.yml
        hostPort: 30080
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  - role: worker
  - role: worker
