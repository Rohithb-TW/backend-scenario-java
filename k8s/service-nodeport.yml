# NodePort service used in kind cluster (CI) so the smoke-test job
# can reach the app via localhost:30080 without an Ingress controller.
apiVersion: v1
kind: Service
metadata:
  name: petclinic-np
  namespace: petclinic
  labels:
    app: petclinic
spec:
  selector:
    app: petclinic
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 9966
      targetPort: 9966
      nodePort: 30080
