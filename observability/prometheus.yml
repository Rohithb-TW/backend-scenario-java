global:
  scrape_interval: 15s      # scrape every 15 seconds
  evaluation_interval: 15s  # evaluate rules every 15 seconds

scrape_configs:
  - job_name: petclinic
    metrics_path: /petclinic/actuator/prometheus
    static_configs:
      - targets:
          - localhost:9966
        labels:
          application: petclinic
