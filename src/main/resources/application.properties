# active profiles config
#
# the application uses two active profiles
#
# one - for select database
# ------------------------------------------------
# When using HSQL, use: hsqldb
# When using MySQL, use: mysql
# When using PostgreSQL, use: postgres
# When using H2, use: h2
# ------------------------------------------------
#
# and one for selected repository layer
# ------------------------------------------------
# When using Spring jpa, use: jpa
# When using Spring JDBC, use: jdbc
# When using Spring Data JPA, use: spring-data-jpa
# ------------------------------------------------

spring.profiles.active=h2,spring-data-jpa

# ------------------------------------------------

server.port=9966
server.servlet.context-path=/petclinic/

# Default database platform; can be overridden by other profile-specific property sources 
spring.sql.init.platform=h2
# Ensures schema & data reload on every restart (good for local dev)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:db/${spring.sql.init.platform}/schema.sql
spring.sql.init.data-locations=classpath*:db/${spring.sql.init.platform}/data.sql

spring.messages.basename=messages/messages
spring.jpa.open-in-view=false

# OpenAPI/Swagger UI (Defaults to true)
#springdoc.api-docs.enabled=true
#springdoc.swagger-ui.enabled=true

logging.level.org.springframework=INFO
#logging.level.org.springframework=DEBUG

#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# enable the desired authentication type
# by default, the authentication is disabled
petclinic.security.enable=false

# ------------------------------------------------
# Actuator / Prometheus observability
# ------------------------------------------------

# Expose health, info, and prometheus scrape endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics,caches
management.endpoint.health.show-details=always
# Kubernetes liveness and readiness probes
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Actuator endpoints are under /petclinic/actuator/ (inherited from server.servlet.context-path)

# Enable HTTP request duration histograms for all requests
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Common tags applied to every metric (appear as Prometheus labels)
management.metrics.tags.application=petclinic

# Enable JVM and process metrics (auto-configured but made explicit)
management.metrics.enable.jvm=true
management.metrics.enable.process=true

# ------------------------------------------------
# HikariCP connection pool — tuned configuration
# ------------------------------------------------
# Max connections handed out concurrently.
# Rule of thumb: (2 x CPU cores) + effective spindle count.
# For a 6-core dev machine this gives ~20; tune down for prod DB limits.

# Keep 10 warm connections ready at all times to avoid cold-start latency.

# Max ms a request waits for a connection before throwing SQLException.
# 30s is safe for normal load; reduces to fail-fast under sustained pool exhaustion.

# Drop idle connections after 10 min to free DB-side resources.
spring.datasource.hikari.idle-timeout=600000

# Recycle connections after 30 min regardless of idle state (prevents stale connections).
spring.datasource.hikari.max-lifetime=1800000

# Log a warning if a connection is held for longer than 60s (catches connection leaks).
spring.datasource.hikari.leak-detection-threshold=60000


# Maximum connections handed out concurrently.
# Rule of thumb: (2 x CPU cores) + effective spindle count.
# For a 6-core dev machine this gives ~20; tune down for prod DB server connection limits.
spring.datasource.hikari.maximum-pool-size=20

# Fixed-pool mode: min-idle == max-pool-size eliminates pool resize churn under load.
spring.datasource.hikari.minimum-idle=20

# Max ms a request waits for a connection before throwing SQLException.
# 30 s is safe for normal load; fail-fast enough to surface pool exhaustion clearly.
spring.datasource.hikari.connection-timeout=30000

# Pool name appears in JMX / Micrometer metrics for easy identification.
spring.datasource.hikari.pool-name=PetclinicPool

# ------------------------------------------------
# Virtual threads (Project Loom — Java 21+)
# ------------------------------------------------
# Replaces the default thread-per-request model with virtual threads,
# dramatically improving throughput under I/O-bound workloads.
spring.threads.virtual.enabled=true

# ------------------------------------------------
# Hibernate batch writes
# ------------------------------------------------
# Batch up to 20 INSERT/UPDATE statements per round-trip to the DB.
spring.jpa.properties.hibernate.jdbc.batch_size=20
# Reorder inserts/updates within the batch to minimize constraint violations.
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ------------------------------------------------
# Caffeine cache configuration — per-cache TTL
# ------------------------------------------------
spring.cache.type=caffeine
spring.cache.cache-names=vets,petTypes,specialties,owners,pets,visits
# Reference data (rarely changes): long TTL
spring.cache.caffeine.petTypes.spec=maximumSize=500,expireAfterWrite=60m
spring.cache.caffeine.specialties.spec=maximumSize=500,expireAfterWrite=60m
# Vet list (changes infrequently): medium TTL
spring.cache.caffeine.vets.spec=maximumSize=500,expireAfterWrite=30m
# Owner/pet data (user-facing writes): short TTL to limit stale reads
spring.cache.caffeine.owners.spec=maximumSize=500,expireAfterWrite=5m
spring.cache.caffeine.pets.spec=maximumSize=500,expireAfterWrite=5m
# Visit data (high write rate): shortest TTL
spring.cache.caffeine.visits.spec=maximumSize=500,expireAfterWrite=2m
